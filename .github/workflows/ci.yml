name: Vérifications

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gesimo
          POSTGRES_PASSWORD: gesimo_test
          POSTGRES_DB: gesimo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gesimo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, gd, intl, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances PHP
        run: composer install --no-interaction --prefer-dist

      - name: Préparer le fichier .env (sans valeur secrète)
        run: cp .env.example .env

      - name: Contrôler le formatage du code
        run: vendor/bin/pint --test

      - name: Lancer les tests
        run: vendor/bin/pest

      - name: Vérifier que les migrations se défont et se rejouent
        env:
          APP_KEY: base64:dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdHRlc3Q=
          DB_URL: pgsql://gesimo:gesimo_test@127.0.0.1:5432/gesimo_test
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --step=20 --force
          php artisan migrate --force

      - name: Vérifier les invitations PWA et le mode hors connexion
        run: node --test tests/Js/*.test.mjs

      - name: Construire les fichiers du site
        run: |
          npm install --ignore-scripts
          npm run build

      - name: Préparer le parcours navigateur du gérant
        env:
          APP_ENV: testing
          APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
          DB_URL: pgsql://gesimo:gesimo_test@127.0.0.1:5432/gesimo_test
        run: |
          php artisan migrate:fresh --force
          php artisan storage:link
          php tests/Support/preparer-profil-gerant.php "$RUNNER_TEMP/avelis-parcours"
          npm install --prefix "$RUNNER_TEMP/avelis-playwright" --ignore-scripts playwright@1.51.1
          "$RUNNER_TEMP/avelis-playwright/node_modules/.bin/playwright" install chromium --with-deps
          # Livewire réserve APP_ENV=testing aux fichiers simulés des tests unitaires.
          # Le navigateur doit utiliser le vrai stockage, sur cette base fictive locale.
          APP_ENV=local php artisan serve --host=127.0.0.1 --port=8123 > "$RUNNER_TEMP/avelis-parcours/serveur.log" 2>&1 &
          for essai in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8123/up && break; sleep 1; done

      - name: Vérifier le parcours gérant dans Chromium
        run: node tests/E2E/profil-gerant.mjs "$RUNNER_TEMP/avelis-playwright" "$RUNNER_TEMP/avelis-parcours"

      - name: Afficher les erreurs du serveur de test
        if: failure()
        run: tail -n 100 storage/logs/laravel.log || true

      - name: Conserver les captures du parcours gérant
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parcours-gerant
          path: |
            ${{ runner.temp }}/avelis-parcours/*.png
            ${{ runner.temp }}/avelis-parcours/serveur.log
          retention-days: 7
