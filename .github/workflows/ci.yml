name: Vérifications

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gesimo
          POSTGRES_PASSWORD: gesimo_test
          POSTGRES_DB: gesimo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gesimo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances PHP
        run: composer install --no-interaction --prefer-dist

      - name: Contrôler le formatage du code
        run: vendor/bin/pint --test

      - name: Lancer les tests
        run: vendor/bin/pest

      - name: Vérifier que les migrations se défont et se rejouent
        env:
          APP_KEY: base64:dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdHRlc3Q=
          DB_URL: pgsql://gesimo:gesimo_test@127.0.0.1:5432/gesimo_test
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --step=20 --force
          php artisan migrate --force

      - name: Construire les fichiers du site
        run: |
          npm install --ignore-scripts
          npm run build
