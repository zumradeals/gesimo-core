# GESIMO Séjours — site Nginx. « __DOMAINE__ » et « __DOSSIER__ » sont remplacés par installer.sh.
# Le HTTPS est ajouté automatiquement par Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAINE__;

    root __DOSSIER__/public;
    index index.php;
    charset utf-8;

    include snippets/gesimo-securite.conf;

    # Photos : 8 par résidence, 5 Mo chacune, envoyées plusieurs à la fois.
    client_max_body_size 40M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fichiers du site : mis en cache longtemps (leurs noms changent à chaque version).
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /storage/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTP_PROXY "";
    }

    # Jamais de fichiers cachés (.env, .git...) ni de scripts dans le dossier des photos.
    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/storage/.*\.php$ { deny all; }
}
